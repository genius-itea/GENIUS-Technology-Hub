<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GENIUS Technology Hub</title>
  <link rel="icon" type="image/x-icon" href="./icon.ico" />
  <meta name="description" content="Knowledge platform about AI in software engineering from the ITEA GENIUS project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img src="imgs/ITEA-GENIUS_Logo_RGB.svg" alt="GENIUS Logo" style="height: 40px; vertical-align: middle;"><br> Technology Hub',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 2, // Keep second level always open
      auto2top: true,

      // complete configuration parameters
      search: {
        maxAge: 86400000, // Expiration time, the default one day
        paths: 'auto', // Automatically index all markdown files
        placeholder: 'Type to search',
        noData: 'No Results!',
        depth: 6,
        hideOtherSidebarContent: false,
      }
    }
  </script>
  <script src="assets/js/plugins.js"></script>

  <!-- Docsify v5 (load the core only once, before its plugins). Keep the theme, core, and plugins on the same version. -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/@alertbox/docsify-footer/dist/docsify-footer.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <script>
  if (typeof navigator.serviceWorker !== 'undefined') {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
